<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>はなこSEリスト</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="header">
        <div class="wrap">
            <h1>はなこSEリスト</h1>
            <p class="lead">クリックするとSE名をコピーします。先頭が同じSEは同じ系統の色になります</p>
            <label class="search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="q" type="search" placeholder="SEを検索" autocomplete="off" autofocus>
                <span id="count" class="count"></span>
            </label>
        </div>
    </header>

    <main class="wrap">
        <p id="status" class="status">読み込み中…</p>
        <ul id="list" class="grid"></ul>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./classify.js"></script>
    <script src="./app.js"></script>
</body>
</html>
